[project]
name = "routerpolicy"
version = "0.0.0"
description = "Shiori: política de routing de modelos (elige el modelo mínimo suficiente por tarea)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Marc Mayol" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Dependencias pesadas de entrenamiento/inferencia. Se instalan solo cuando toca
# (Fase 4/6), no en el scaffolding. Mantiene la CI y el dev loop ligeros.
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "trl>=0.9",
    "peft>=0.11",
    "datasets>=2.20",
]
# Ingesta de fuentes para el etiquetado offline (Fase 2, run post-gate).
label = [
    "datasets>=2.20",
    "evalplus>=0.3",
]

[project.scripts]
check-env = "routerpolicy.scripts_entry:check_env_main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routerpolicy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

# torch (extra `train`) y datasets/evalplus (extra `label`) no se instalan en
# dev/CI; se importan de forma perezosa, así que no exigimos sus stubs.
[[tool.mypy.overrides]]
module = ["torch.*", "datasets.*", "evalplus.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
