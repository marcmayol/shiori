[package]
name = "shiori"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local proxy in front of the LLM APIs (Anthropic, OpenAI, Gemini) to cut cost and latency without losing quality. Works with Claude Code and with subscriptions."
keywords = ["llm", "proxy", "claude-code", "anthropic", "cache"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "shiori"
path = "src/lib.rs"

[[bin]]
name = "shiori"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "query", "json"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.34"
# La clave de `shiori stop`: aleatoria del sistema operativo.
getrandom = "=0.3.4"
memory-stats = "1.2.0"
# Sin aws-lc-rs: con ring compila en Windows, macOS y Linux sin cmake ni NASM.
# Con el verificador de la plataforma, las raíces del sistema (proxies de empresa que inspeccionan HTTPS).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "system-proxy", "json"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
tempfile = "3.27.0"

[[bench]]
name = "capas"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
