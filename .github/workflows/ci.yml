name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # CI ligera: lint + tipos + tests unitarios. Sin GPU (la detección GPU se
  # prueba con el parser puro, no con hardware real).
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync (dev group, sin extras pesados de train)
        run: uv sync --group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest
